<style>
  :root {
    --page: #f3faf7; --card: #ffffff; --tint: #e7f3ef; --tint-2: #eef6f2;
    --ink: #1f3b2c; --sub: #4c655a; --line: #d6e8de;
    --deep: #26715f; --primary: #2f8d78; --seal: #a8402f;
  }
  * { box-sizing: border-box; }
  body { background: var(--page); color: var(--ink); margin: 0; padding: 0 20px 72px;
    font-family: "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height: 1.7; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-family: "Songti TC","Noto Serif TC",serif; font-size: clamp(30px, 5vw, 44px); margin: 0 0 12px; font-weight: 700; }
  header.page { padding: 44px 0 8px; text-align: center; }
  .eyebrow { font-size: 13px; letter-spacing: .35em; color: var(--sub); margin: 0 0 10px; }
  .oneline { font-size: clamp(15px, 2vw, 18px); color: var(--deep); font-weight: 700; margin: 0 0 6px; }
  .cap { font-size: 13px; color: var(--sub); margin: 0 auto 8px; max-width: 48em; text-align: center; }

  nav.toc { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0 6px; }
  nav.toc a { display: inline-flex; align-items: center; gap: 6px; background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px;
    text-decoration: none; color: var(--ink); font-size: 13px; font-weight: 700; }
  nav.toc a:hover { border-color: var(--primary); color: var(--deep); }
  nav.toc .s { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
    background: var(--seal); color: #fff; border-radius: 5px; font-size: 12px; font-weight: 700;
    font-family: "Songti TC","Noto Serif TC",serif; }

  .connector { text-align: center; padding: 22px 0 10px; }
  .connector .dn { color: var(--primary); font-size: 26px; line-height: 1; }
  .connector .why { font-size: 13.5px; color: var(--sub); margin-top: 2px; }
  .connector .eq { font-size: 15px; font-weight: 700; color: var(--deep);
    font-family: "Songti TC","Noto Serif TC",serif; margin-top: 2px; }

  section.mapblock { margin-top: 10px; }
  .mapbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 0 2px 8px; }
  .mapbar .s { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
    background: var(--seal); color: #fff; border-radius: 7px; font-size: 17px; font-weight: 700;
    font-family: "Songti TC","Noto Serif TC",serif; }
  .mapbar .lv { font-size: 12px; font-weight: 700; color: var(--primary); letter-spacing: .08em; }
  .mapbar .nm { font-size: 17px; font-weight: 700; font-family: "Songti TC","Noto Serif TC",serif; }
  .mapbar a.open { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--primary);
    text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; background: var(--card); }
  .mapbar a.open:hover { border-color: var(--primary); }
  iframe.mapframe { width: 100%; height: 760px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--page); display: block; }

  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--sub); text-align: center; }
  @media (max-width: 700px) { iframe.mapframe { height: 620px; } }

  figure.cascade { margin: 8px 0 0; overflow-x: auto; }
  figure.cascade svg { min-width: 1000px; width: 100%; height: auto; display: block; }
  .cg { fill: var(--tint); stroke: var(--primary); stroke-width: 1.5; }
  .cn { fill: var(--card); stroke: var(--line); stroke-width: 1.3; }
  .cm { fill: var(--card); stroke: var(--line); stroke-width: 1.1; }
  .csub { fill: var(--tint-2); stroke: var(--line); }
  .csl { fill: var(--seal); }
  .ct { font-size: 15px; font-weight: 700; fill: var(--ink); }
  .ct2 { font-size: 11.5px; fill: var(--sub); }
  .ctw { font-size: 17px; font-weight: 700; fill: var(--deep); font-family: "Songti TC","Noto Serif TC",serif; }
  .cts { font-size: 15px; font-weight: 700; fill: #fff; font-family: "Songti TC","Noto Serif TC",serif; }
  .ceq { font-size: 14px; font-weight: 700; fill: var(--deep); font-family: "Songti TC","Noto Serif TC",serif; }
  .cf { stroke: var(--primary); stroke-width: 1.8; fill: none; }
  .cfu { stroke: var(--deep); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  .clbl { font-size: 12px; font-weight: 600; fill: var(--deep); paint-order: stroke; stroke: var(--page); stroke-width: 5px; stroke-linejoin: round; }
  svg a { cursor: pointer; }
  svg a:hover rect { stroke: var(--primary); stroke-width: 2; }
</style>
